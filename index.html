<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Calisthenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0}

:root{color-scheme:dark;
 --bg:#000000; --s1:#0f100f; --s2:#181a18; --s3:#232622; --line:#262a25; --tx:#f1f4ee; --mu:#8c9587;
 --acc:#b4f03c; --acc-ink:#0b0f05; --acc-soft:rgba(180,240,60,.13); --warn:#ff9f1c; --bad:#ff5d50; --good:#5fd38a;
 --fig-bg:#080908; --prop:#4d5548; --h0:#161915; --fig-filter:none; --mb:#30362c; --nb:#1d211b; --pri:#ff3b30; --sec:#f0968c; --h1:#3c5a1a; --h2:#5f8f1f; --h3:#8cc628; --h4:#b4f03c;
 --r:16px; --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg); color:var(--tx); font:15px/1.5 var(--body); padding-inline:16px; padding-block:0 96px; -webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.app{max-width:560px; margin:0 auto}
h2{font:700 26px/1.1 var(--disp); letter-spacing:.2px; margin:2px 0 4px; text-wrap:balance}
.muted{color:var(--mu)} .small{font-size:12.5px}
.eyebrow{font:600 11.5px/1.2 var(--body); text-transform:uppercase; letter-spacing:.09em; color:var(--mu)}
.mt{margin-top:14px}
.row{display:flex; gap:10px; align-items:center} .row.sp{justify-content:space-between} .row.end{justify-content:flex-end; flex-wrap:wrap; margin-bottom:12px}
/* top */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:14px 10px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.brand svg{width:42px; height:24px}
.brand b{font:700 27px/1 var(--disp); letter-spacing:.3px} .brand b span{color:var(--acc)}
.brand small{display:block; font-size:11px; color:var(--mu); letter-spacing:.02em}
.segs{display:flex; background:var(--s1); border:1px solid var(--line); border-radius:999px; padding:3px}
.seg{border:0; background:none; padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--mu)}
.seg.on{background:var(--acc); color:var(--acc-ink)}
.segs:empty{display:none}
.segrow{display:flex; gap:6px; margin-bottom:14px; background:var(--s1); border:1px solid var(--line); padding:4px; border-radius:14px}
.segrow .seg{flex:1; padding:9px 6px; border-radius:10px; font-size:13.5px}
.banner{background:var(--acc-soft); border:1px solid var(--line); color:var(--tx); border-radius:12px; padding:9px 12px; font-size:13px; margin-bottom:12px}
.hint{font-size:13px; color:var(--mu); background:var(--s1); border:1px dashed var(--line); border-radius:12px; padding:10px 12px}
/* cards */
main{display:flex; flex-direction:column; gap:12px}
.card{background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.grid2{display:grid; grid-template-columns:1.35fr 1fr; gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.bignum{font:700 44px/1 var(--disp); letter-spacing:.3px; margin-top:6px; font-variant-numeric:tabular-nums}
.bignum small{font-size:18px; color:var(--mu)} .bignum.sm{font-size:30px; margin:0}
.streak .bignum{color:var(--acc)}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px}
.wd{display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 7px; border-radius:12px; background:var(--s2); font-size:11.5px; color:var(--mu)}
.wd b{font:700 19px/1 var(--disp); color:var(--tx)}
.wd i{width:6px; height:6px; border-radius:50%; background:transparent}
.wd.plan i{background:var(--prop)} .wd.done i{background:var(--acc)}
.wd.now{background:var(--acc); color:var(--acc-ink)} .wd.now b{color:var(--acc-ink)} .wd.now.plan i,.wd.now.done i{background:var(--acc-ink)}
.today .row.sp{align-items:flex-start}
.btn{border:1px solid var(--line); background:var(--s2); border-radius:12px; padding:9px 14px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.btn:hover{border-color:var(--mu)} .btn:disabled{opacity:.4; cursor:default}
.btn.pri{background:var(--acc); color:var(--acc-ink); border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px; font-size:13px; border-radius:10px}
.btn.big{padding:12px 18px; font-size:16px; border-radius:14px}
.btn.danger{background:var(--bad); border-color:var(--bad); color:#fff}
.dangertxt{color:var(--bad)}
.ic{width:16px; height:16px; fill:currentColor}
.exlist{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
.exlist li,.pbs li{display:flex; align-items:center; gap:12px}
.exlist li div{display:flex; flex-direction:column; line-height:1.3}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chip{border:1px solid var(--line); background:var(--s1); border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600}
.chip.st{cursor:default; background:var(--s2)} .chip.acc{color:var(--acc); border-color:var(--acc-soft)}
.delta{font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--s2)} .delta.dn{color:var(--good)} .delta.up{color:var(--warn)}
.chart{width:100%; height:90px; display:block; margin-top:8px}
.chart .grid{stroke:var(--line); stroke-dasharray:3 4} .chart .area{fill:var(--acc-soft)} .chart .ln{fill:none; stroke:var(--acc); stroke-width:2.2; vector-effect:non-scaling-stroke} .chart .dot{fill:var(--acc)}
.chart-empty{height:24px}
.axis{display:flex; justify-content:space-between; font-size:11px; color:var(--mu); font-variant-numeric:tabular-nums}
.bwform{display:flex; gap:8px; margin-top:10px}
input,select,textarea{background:var(--s2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; width:100%; min-width:0}
textarea{resize:vertical}
/* figures */
.fig{background:var(--fig-bg); border-radius:12px; overflow:hidden; flex:none; position:relative; aspect-ratio:1; max-width:100%}
.fig .fl{position:absolute; inset:0; overflow:hidden}
.fig img{height:100%; max-width:none; display:block; filter:var(--fig-filter); will-change:transform}
.fig.thumb{width:52px; height:52px; border-radius:10px}
.fig.big{width:100%}
.fig.anim .fl{opacity:0; animation:3.6s ease-in-out infinite}
.fig.anim.n3 .l0{animation-name:a3a} .fig.anim.n3 .l1{animation-name:a3b} .fig.anim.n3 .l2{animation-name:a3c}
.fig.anim.n2 .l0{animation-name:a2a} .fig.anim.n2 .l1{animation-name:a2b}
.fig.anim.n1 .l0{opacity:1; animation:none}
@keyframes a3a{0%,14%{opacity:1}26%,88%{opacity:0}100%{opacity:1}}
@keyframes a3b{0%,14%{opacity:0}26%,39%{opacity:1}51%,63%{opacity:0}75%,88%{opacity:1}100%{opacity:0}}
@keyframes a3c{0%,39%{opacity:0}51%,63%{opacity:1}75%,100%{opacity:0}}
@keyframes a2a{0%,36%{opacity:1}50%,86%{opacity:0}100%{opacity:1}}
@keyframes a2b{0%,36%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fig.anim .fl{animation:none} .fig.anim .l0{opacity:1}}
.figcard + .mchips{margin-bottom:12px}
/* real photos (free-exercise-db): start and end position, softly crossfaded */
.fig.ph{background:#000}
.fig.ph:not(.thumb){aspect-ratio:4/3}
.fig.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:none; max-width:none}
.fig.ph.anim .p1{opacity:0; animation:phx 3.4s ease-in-out infinite}
@keyframes phx{0%,30%{opacity:0}45%,80%{opacity:1}95%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.fig.ph.anim .p1{animation:none}}
.figcard{display:grid; grid-template-columns:1.25fr 1fr; gap:10px; align-items:center; background:var(--fig-bg); border:1px solid var(--line); border-radius:16px; padding:8px}
.figcard .fig{border-radius:10px}
.mapbox{display:flex; flex-direction:column; gap:6px; align-items:center}
.bodymap{width:100%; max-width:230px; display:block}
.bodymap polygon{stroke:var(--bg); stroke-width:.35}
.bodymap .mb{fill:var(--mb)} .bodymap .nb{fill:var(--nb)} .bodymap .pri{fill:var(--pri)} .bodymap .sec{fill:var(--sec)}
.bodymap.edit polygon[data-act]{cursor:pointer} .bodymap.edit polygon[data-act]:hover{opacity:.75}
.bm-l{fill:var(--mu); font-size:8px; text-anchor:middle; font-family:var(--body)}
.legend2{display:flex; gap:12px; font-size:11.5px; color:var(--mu)} .legend2 i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px} .legend2 i.pri{background:var(--pri)} .legend2 i.sec{background:var(--sec)}
.mchips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.mc{font-size:12px; font-weight:600; padding:3px 9px; border-radius:999px; border:1px solid var(--line)}
.mc.pri{background:var(--pri); color:#fff; border-color:var(--pri)} .mc.sec{color:var(--tx); background:transparent; border-color:var(--sec)}
.mline{font-size:12px; color:var(--pri); font-weight:600}
.expreview{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; margin:6px 0 10px}
@media (max-width:480px){.expreview{grid-template-columns:1fr}}
.credits{font-size:11px; color:var(--mu); margin-top:6px; line-height:1.5} .credits a{color:inherit}
.lb{fill:none; stroke:var(--acc); stroke-width:6.5; stroke-linecap:round; stroke-linejoin:round}
.far{opacity:.42} .far.front{opacity:1} .hd{fill:var(--acc)}
.pr{stroke:var(--prop); stroke-width:2.2} .br{stroke:var(--mu); stroke-width:4.5; stroke-linecap:round}
/* levels */
.lvhero h2{font-size:30px}
.lvpath{display:flex; align-items:center; margin-top:14px}
.lvline{flex:1; height:3px; background:var(--s3); border-radius:3px; min-width:6px}
.lvstep{border:0; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--mu); width:52px}
.lvdot{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--s2); border:2px solid var(--line); font:700 19px/1 var(--disp); color:var(--mu)}
.lvdot .ic{width:18px; height:18px}
.lvlab{font-size:10.5px; font-weight:600; line-height:1.15; text-align:center}
.lvstep.done .lvdot{background:var(--acc); border-color:var(--acc); color:var(--acc-ink)}
.lvstep.cur .lvdot{border-color:var(--acc); color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft)}
.lvstep.cur .lvlab,.lvstep.done .lvlab{color:var(--tx)}
.lvstep.sel .lvdot{transform:scale(1.12)} .lvstep.sel .lvlab{text-decoration:underline; text-underline-offset:3px}
.lvlock .row{gap:8px} .lvlock .ic{width:20px; height:20px; color:var(--mu)}
.exlist li.dim{opacity:.5}
.lvtest{border-color:var(--acc-soft)} .lvtest.passed{border-color:var(--line)}
.lvtest h2 .ic{width:22px; height:22px; color:var(--acc); vertical-align:-3px}
.tests{list-style:none; padding:0; margin:12px 0 14px; display:flex; flex-direction:column; gap:8px}
.tests li{display:flex; align-items:center; gap:12px; background:var(--s2); border:1px solid var(--line); border-radius:14px; padding:8px 10px}
.tests li.ok{border-color:var(--acc)} .tests li.miss{border-color:var(--bad)}
.tinfo{flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; line-height:1.25}
.tbar{height:6px; background:var(--s3); border-radius:6px; overflow:hidden} .tbar i{display:block; height:100%; background:var(--acc)}
.tnum{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.tnum b{font:700 22px/1 var(--disp); font-variant-numeric:tabular-nums} .tests li.ok .tnum b{color:var(--acc)} .tests li.miss .tnum b{color:var(--bad)}
.tin input{width:84px; text-align:center; font:700 20px/1 var(--disp); padding:8px}
.btn.wide{width:100%; justify-content:center}
.tres{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding-top:6px}
.tres .tests{width:100%; text-align:left}
.tbadge{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font:700 34px/1 var(--disp); background:var(--bad); color:#fff}
.tres.ok .tbadge{background:var(--acc); color:var(--acc-ink)} .tbadge .ic{width:36px; height:36px}
.oktxt{color:var(--acc)}
.libsec{display:flex; flex-direction:column; gap:8px} .libsec h2{font-size:22px} .libsec .chip .ic{width:13px; height:13px; vertical-align:-2px}
/* stats */
.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:12px}
.hm-wrap{overflow-x:auto; margin-top:10px}
.hm{width:100%; min-width:340px; display:block} .hl{fill:var(--mu); font-size:9px; font-family:var(--body)}
.h0{fill:var(--h0)} .h1{fill:var(--h1)} .h2{fill:var(--h2)} .h3{fill:var(--h3)} .h4{fill:var(--h4)}
.legend{display:flex; align-items:center; gap:4px; justify-content:flex-end; margin-top:6px}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block} .legend i.h0{background:var(--h0)} .legend i.h1{background:var(--h1)} .legend i.h2{background:var(--h2)} .legend i.h3{background:var(--h3)} .legend i.h4{background:var(--h4)}
.pbs,.recent{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:8px}
.pbs li span:nth-child(2){flex:1} .pbs li b{font:700 22px/1 var(--disp); color:var(--acc); font-variant-numeric:tabular-nums}
.pbs li .muted{width:52px; text-align:right}
.recent li{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent li div:first-child{display:flex; flex-direction:column}
.recent .nums{display:flex; flex-direction:column; align-items:flex-end; font-size:13px; font-variant-numeric:tabular-nums; color:var(--mu)}
/* coach */
.people,.plist,.exgrid{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px}
.people li{display:flex; align-items:center; gap:12px; background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:12px}
.people img,.av-lg{width:40px; height:40px; border-radius:50%; background:var(--s3); flex:none; object-fit:cover}
.av-lg{width:52px; height:52px}
.pinfo{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.pinfo select{padding:6px 8px; font-size:13.5px}
@media (max-width:480px){.people li{flex-wrap:wrap} .people li .btn{width:100%; justify-content:center}}
.prog{width:100%; text-align:left; background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; flex-direction:column; gap:4px}
.prog:hover,.excard:hover{border-color:var(--acc)}
.prog b{font:700 21px/1.1 var(--disp)}
.daydots{display:flex; gap:4px; margin-top:4px}
.daydots i{font-style:normal; font-size:11px; font-weight:600; width:28px; text-align:center; padding:3px 0; border-radius:7px; background:var(--s2); color:var(--mu)}
.daydots i.on{background:var(--acc); color:var(--acc-ink)}
.exgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
@media (max-width:480px){.exgrid{grid-template-columns:repeat(2,1fr)}}
.excard{width:100%; height:100%; text-align:left; background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:3px}
.excard .fig{width:100%; margin-bottom:4px}
.excard b{font-size:13.5px; line-height:1.25}
/* sheet */
#sheet{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55); display:flex; justify-content:center; align-items:flex-end; padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--bg); border:1px solid var(--line); border-radius:20px 20px 0 0; width:100%; max-width:600px; max-height:92%; overflow:auto; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){#sheet{align-items:center} .sheet{border-radius:20px; max-height:90%}}

.fgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:10px}
.fgrid.f3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.fgrid{grid-template-columns:1fr} .fgrid.f3{grid-template-columns:repeat(3,1fr)}}
.fld{display:flex; flex-direction:column; gap:4px; margin-top:8px} .fgrid .fld{margin-top:0}
.fld label,.nums3 label{font-size:12px; color:var(--mu); font-weight:600}
.sheetfoot{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:18px; padding-top:14px; border-top:1px solid var(--line); flex-wrap:wrap}
.pdays{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.pday{border:1px solid var(--line); border-radius:14px; padding:10px 12px; background:var(--s1)}
.pday:not(.on){opacity:.75}
.tog{display:flex; align-items:center; gap:8px; font-weight:700; cursor:pointer}
.tog input{width:18px; height:18px; accent-color:var(--acc)}
.pitems{list-style:none; padding:0; margin:10px 0 0; display:flex; flex-direction:column; gap:8px}
.pitems li{display:flex; gap:10px; align-items:flex-start; background:var(--s2); border-radius:12px; padding:8px}
.pi{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px}
.nums3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.nums3 input{padding:5px 7px}
.pibtns{display:flex; flex-direction:column; gap:4px}
.ibtn{width:34px; height:34px; border-radius:10px; border:1px solid var(--line); background:var(--s1); display:grid; place-items:center; font-size:16px; line-height:1}
.ibtn:disabled{opacity:.35; cursor:default}
.pibtns .ibtn{width:28px; height:28px; font-size:14px}
.addrow{display:flex; gap:8px; margin-top:8px}
/* bottom tabs */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--s1); border-top:1px solid var(--line); display:flex; justify-content:center; gap:4px; padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1; max-width:150px; border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px; border-radius:12px; color:var(--mu); font-size:11.5px; font-weight:600}
.tab svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.tab.on{color:var(--acc)} .tab.on svg{stroke:var(--acc)}
/* workout overlay */
#wo{position:fixed; inset:0; z-index:30; background:var(--bg); padding-top:env(safe-area-inset-top,0px)}
.wo-shell{height:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column}
.wo-head{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; padding:12px 16px 10px; position:relative}
.wo-title{text-align:center; display:flex; flex-direction:column; line-height:1.25}
.wo-title b{font:700 20px/1.1 var(--disp)}
.ibtn.ok{background:var(--acc); color:var(--acc-ink); border-color:var(--acc)}
.wo-prog{grid-column:1/-1; height:4px; background:var(--s3); border-radius:4px; overflow:hidden}
.wo-prog i{display:block; height:100%; background:var(--acc); transition:width .3s}
.wo-scroll{flex:1; overflow:auto; padding:4px 16px 16px}
.wo-fig .fig{border:1px solid var(--line)}
#wo-body h2{font-size:30px; margin-top:6px}
.cue{font-size:13.5px; color:var(--mu); margin:10px 0 0}
.setrows{list-style:none; padding:0; margin:14px 0 0; display:flex; flex-direction:column; gap:6px}
.setrows li{display:grid; grid-template-columns:40px 1fr auto auto; align-items:center; gap:10px; background:var(--s1); border:1px solid var(--line); border-radius:12px; padding:8px 10px}
.setrows li.hdr{background:none; border:0; padding:0 10px; font-size:11.5px; color:var(--mu); text-transform:uppercase; letter-spacing:.08em; grid-template-columns:40px 1fr}
.setrows li.ok{border-color:var(--acc); background:var(--acc-soft)}
.sn{font:700 20px/1 var(--disp); color:var(--mu); text-align:center}
.step{display:flex; align-items:center; gap:10px}
.step b{font:700 24px/1 var(--disp); min-width:48px; text-align:center; font-variant-numeric:tabular-nums}
.step .ibtn{width:32px; height:32px}
.check{width:42px; height:42px; border-radius:12px; border:1.5px solid var(--line); background:var(--s2); font-size:19px; color:var(--mu); font-weight:700}
.check.on{background:var(--acc); border-color:var(--acc); color:var(--acc-ink)}
.dots{display:flex; gap:6px; justify-content:center; margin-top:16px}
.dotb{width:10px; height:10px; border-radius:50%; border:0; background:var(--s3); padding:0}
.dotb.fin{background:var(--h2)} .dotb.cur{background:var(--acc); width:24px; border-radius:6px}

.wo-nav .btn{flex:1; justify-content:center; padding:12px}
.restbar{display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:12px; margin:0 16px 8px; background:var(--s1); border:1px solid var(--acc); border-radius:16px; padding:10px 14px}
.restclock{font:700 30px/1 var(--disp); color:var(--acc); font-variant-numeric:tabular-nums}
.rtrack{height:6px; background:var(--s3); border-radius:6px; overflow:hidden} .rtrack i{display:block; height:100%; background:var(--acc)}
.quitbox{margin:0 16px 8px; background:var(--s1); border:1px solid var(--bad); border-radius:16px; padding:12px 14px}
.quitbox p{margin:0 0 10px}
.summary{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:24px 16px; text-align:center}
.summary .fig{width:min(260px,70vw)}
.summary h2{font-size:36px}
.summary .tiles{grid-template-columns:repeat(3,1fr); width:100%; max-width:420px}
#toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:40; background:var(--tx); color:var(--bg); padding:9px 16px; border-radius:12px; font-size:13.5px; font-weight:600; max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function bodyMap(mus, editable){
  const P=new Set((mus.p||[]).map(mKey)), Sx=new Set((mus.s||[]).map(mKey));

    const cls = P.has(k)?'pri': Sx.has(k)?'sec': mus?'mb':'nb';
    return polys.map(pts=>`<polygon points="${pts}" transform="translate(${dx} 0)" class="${cls}"${editable&&mus?` data-act="muscle" data-m="${k}"`:''}><title>${esc(mus?mName(k):'')}</title></polygon>`).join(''); }).join('');
  return `<svg class="bodymap${editable?' edit':''}" viewBox="0 0 212 206" role="img" aria-label="${esc(t('muscles'))}">${part(BODY.front,0)}${part(BODY.back,112)}

const DAYK=['dayA','dayB','dayC'];

const lvName = i => `${t('level')} ${i+1} · ${t('lvn')[i]}`;
const planItems = (lv,d) => LEVELS[lv].days[d].map(([exId,sets,v,rest])=>{ const ex=EX[exId]; return {exId, sets, reps:ex.mode==='reps'?v:ex.reps, secs:ex.mode==='time'?v:ex.secs, rest}; });
function bestOf(exId){ let b=0; for(const s of S.sessions) for(const it of s.items||[]) if(it.exId===exId) b=Math.max(b,...(it.sets||[0]));
  for(const r of S.tests||[]) if(r.res && r.res[exId]!=null) b=Math.max(b, +r.res[exId]||0); return b; }
const unit = exId => EX[exId].mode==='time' ? t('sec') : '';
function nextDay(lv){ const n=S.sessions.filter(s=>s.level===lv).length; return n%3; }

const S = { lang: ['uz','en','ru'].includes(store('cx-lang')) ? store('cx-lang') : 'uz',
  view:'levels', open:null, level:0, tests:[], sessions:[], bw:[], ex:EX, uid:'me' };
const clone = o => JSON.parse(JSON.stringify(o));
function load(){
  let d=null; try{ d=JSON.parse(localStorage.getItem('cx-data')||'null'); }catch(e){}
  if(d){ S.sessions=d.sessions||[]; S.bw=d.bw||[]; S.level=Math.min(LEVELS.length, Math.max(0, d.level|0)); S.tests=d.tests||[]; }
  S.open=Math.min(S.level, LEVELS.length-1);
}
function save(){ try{ localStorage.setItem('cx-data', JSON.stringify({v:2, level:S.level, tests:S.tests, sessions:S.sessions, bw:S.bw})); return true; }catch(e){ toast(t('saveErr')); return false; } }
function exportData(){
  const blob=new Blob([JSON.stringify({v:2, level:S.level, tests:S.tests, sessions:S.sessions, bw:S.bw}, null, 1)], {type:'application/json'});
  const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='calisthenix-backup-'+dkey(new Date())+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000);
}
function importData(file){
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.sessions && !d.bw) throw 0;
    S.sessions=d.sessions||[]; S.bw=d.bw||[]; S.level=Math.min(LEVELS.length, Math.max(0,d.level|0)); S.tests=d.tests||[]; S.open=Math.min(S.level,LEVELS.length-1); save(); renderMain(); toast(t('saved')); }
    catch(e){ toast(t('badFile')); } }; r.readAsText(file);
}
async function put(path, data){            // kept for the workout player: logs/<uid>/w/<id> and logs/<uid>
  const s=path.split('/');
  if(s[0]==='logs' && s[2]==='w') S.sessions.push({id:s[3], ...data});
  else if(s[0]==='logs') S.bw=data?.bw||[];
  const ok=save(); renderMain(); return ok;
}

/* ===== Levels ===== */
function lvState(i){ return i<S.level ? 'done' : i===S.level ? 'cur' : 'lock'; }
function testRows(i){
  return LEVELS[i].test.map(([id,tg])=>{ const b=bestOf(id), pct=Math.min(100, Math.round(b/tg*100)), ok=b>=tg;
    return `<li class="${ok?'ok':''}">${figHTML(EX[id].anim,'thumb')}<div class="tinfo"><b>${esc(exName(EX[id]))}</b>
      <div class="tbar"><i style="width:${pct}%"></i></div></div>
      <div class="tnum"><b>${b||'—'}${b?unit(id):''}</b><span class="muted small">/ ${tg}${unit(id)}${SIDED.has(id)?' · '+t('perSide'):''}</span></div></li>`; }).join('');
}
function vLevels(){
  const cur=Math.min(S.level, LEVELS.length-1), allDone=S.level>=LEVELS.length;
  const path=LEVELS.map((L,i)=>{ const st=lvState(i);
    return `<button class="lvstep ${st}${S.open===i?' sel':''}" data-act="lvopen" data-i="${i}" aria-label="${esc(lvName(i))}"><span class="lvdot">${st==='done'?CHECK:st==='lock'?LOCK:i+1}</span><span class="lvlab">${esc(t('lvn')[i])}</span></button>`; }).join('<i class="lvline"></i>');
  const hero=`<section class="card lvhero"><div class="eyebrow">${t('yourLevel')}</div>
    <h2>${allDone? esc(t('eliteDone')) : esc(lvName(cur))}</h2><p class="muted small">${esc(allDone? t('testFinal') : t('lvd')[cur])}</p>
    <div class="lvpath">${path}</div></section>`;
  const i=S.open ?? cur, st=lvState(i), L=LEVELS[i];
  if(st==='lock') return hero+`<section class="card lvlock"><div class="row">${LOCK}<b>${esc(lvName(i))}</b></div><p class="muted small">${esc(t('lvd')[i])}</p>
    <p class="small">${t('unlockBy',{lv:esc(t('lvn')[i-1])})}</p>
    <div class="eyebrow mt">${t('allDays')}</div><ul class="exlist">${[...new Set(L.days.flat().map(x=>x[0]))].map(id=>`<li class="dim">${figHTML(EX[id].anim,'thumb')}<div><b>${esc(exName(EX[id]))}</b></div></li>`).join('')}</ul></section>`;
  const nd=nextDay(i), items=planItems(i,nd);
  const next=`<section class="card today"><div class="row sp"><div><div class="eyebrow">${t('nextUp')} · ${esc(t('ofLevel',{n:i+1}))}</div><h2>${esc(t(DAYK[nd]))}</h2>
      <div class="muted small">${t('exCount',{n:items.length})} · ${t('setsTotal',{n:items.reduce((a,x)=>a+x.sets,0)})}</div></div>
      <button class="btn pri big" data-act="start" data-lv="${i}" data-day="${nd}">${PLAY}<span>${t('start')}</span></button></div>
    <ul class="exlist">${items.map(it=>`<li>${figHTML(EX[it.exId].anim,'thumb')}<div><b>${esc(exName(EX[it.exId]))}</b><span class="muted small">${tgt({...it, ex:EX[it.exId]})} · ${t('rest')} ${it.rest}${t('sec')}</span></div></li>`).join('')}</ul></section>
    <div class="chips"><span class="muted small">${t('allDays')}:</span>${[0,1,2].filter(d=>d!==nd).map(d=>`<button class="chip" data-act="start" data-lv="${i}" data-day="${d}">${esc(t(DAYK[d]))}</button>`).join('')}</div>`;
  const ready=L.test.every(([id,tg])=>bestOf(id)>=tg);
  const test=`<section class="card lvtest${st==='done'?' passed':''}"><div class="row sp"><div><div class="eyebrow">${i===LEVELS.length-1?t('finalTest'):t('levelTest')}</div>
      <h2>${st==='done'?`${CHECK} ${t('completed')}`:esc(i<LEVELS.length-1?t('lvn')[i]+' → '+t('lvn')[i+1]:t('lvn')[i])}</h2></div></div>
    <p class="muted small">${esc(st==='done'?t('howTo'):ready?t('readyTest'):t('howTo'))}</p>
    <ul class="tests">${testRows(i)}</ul>
    <button class="btn ${st==='done'?'ghost':'pri'} big wide" data-act="test" data-lv="${i}">${st==='done'?t('repeatTest'):t('takeTest')}</button></section>`;
  return hero+next+test;
}

/* ===== Exercise library (by level) ===== */
function vLibrary(){
  return LEVELS.map((L,i)=>{ const ids=[...new Set(L.days.flat().map(x=>x[0]).concat(L.test.map(x=>x[0])))]; const lock=lvState(i)==='lock';
    return `<section class="libsec"><div class="row sp"><h2>${esc(lvName(i))}</h2>${lock?`<span class="chip st">${LOCK} ${t('locked')}</span>`:''}</div>
      <ul class="exgrid">${ids.map(id=>{ const e=EX[id]; return `<li><button class="excard" data-act="exinfo" data-id="${id}">${figHTML(e.anim,'anim')}<b>${esc(exName(e))}</b><span class="mline">${exMuscles(e).p.slice(0,2).map(m=>esc(mName(mKey(m)))).join(', ')}</span><span class="muted small">${t(e.type||'push')}</span></button></li>`; }).join('')}</ul></section>`; }).join('');
}

/* ===== Sheet: level test + exercise info ===== */
let SH=null;
function openSheet(o){ navPush(); SH=o; $('#sheet').hidden=false; document.body.classList.add('noscroll'); renderSheet(); }
function closeSheet(){ navBack(_closeSheet); }
function _closeSheet(){ $('#sheet').hidden=true; SH=null; document.body.classList.remove('noscroll'); }
function renderSheet(){
  const b=$('#sheet-body'); if(!SH) return;
  if(SH.kind==='ex'){ const e=EX[SH.id], mu=exMuscles(e);
    b.innerHTML=`<div class="row sp"><h2>${esc(exName(e))}</h2><button class="ibtn" data-act="sclose" aria-label="${t('close')}">✕</button></div>
      <div class="figcard">${figHTML(e.anim,'big anim')}<div class="mapbox">${bodyMap(mu,false)}<div class="legend2"><span><i class="pri"></i>${t('primary')}</span><span><i class="sec"></i>${t('secondary')}</span></div></div></div>

  if(SH.result){ const r=SH.result, last=i===LEVELS.length-1;
    b.innerHTML=`<div class="tres ${r.pass?'ok':'no'}"><div class="tbadge">${r.pass?CHECK:'!'}</div><h2>${r.pass?t('testPassT'):t('testFailT')}</h2>
      <p class="muted">${r.pass?(last?t('testFinal'):t('testPass',{lv:esc(lvName(i+1))})):t('testFail')}</p>
      <ul class="tests">${L.test.map(([id,tg])=>{ const v=+r.res[id]||0, ok=v>=tg; return `<li class="${ok?'ok':'miss'}">${figHTML(EX[id].anim,'thumb')}<div class="tinfo"><b>${esc(exName(EX[id]))}</b></div><div class="tnum"><b>${v}${unit(id)}</b><span class="muted small">/ ${tg}${unit(id)}</span></div></li>`; }).join('')}</ul>
      <button class="btn pri big wide" data-act="sclose">${t('close')}</button></div>`; return; }
  b.innerHTML=`<div class="row sp"><div><div class="eyebrow">${i===LEVELS.length-1?t('finalTest'):t('levelTest')}</div><h2>${esc(lvName(i))}</h2></div><button class="ibtn" data-act="sclose" aria-label="${t('close')}">✕</button></div>
    <p class="muted small">${t('testIntro')}</p>
    <form data-form="test"><ul class="tests tin">${L.test.map(([id,tg])=>`<li>${figHTML(EX[id].anim,'thumb')}<div class="tinfo"><label for="t-${id}"><b>${esc(exName(EX[id]))}</b></label>
      <span class="muted small">${t('needed')}: ${tg}${unit(id)}${SIDED.has(id)?' · '+t('perSide'):''} · ${t('best')}: ${bestOf(id)||'—'}</span></div>
      <input id="t-${id}" name="${id}" type="number" min="0" max="999" inputmode="numeric" required placeholder="${unit(id)?t('sec'):t('reps')}"></li>`).join('')}</ul>

function submitTest(form){
  const i=SH.lv, L=LEVELS[i], res={};
  for(const [id] of L.test) res[id]=Math.max(0, parseInt(form.elements[id].value,10)||0);
  const pass=L.test.every(([id,tg])=>res[id]>=tg);
  S.tests.push({ts:Date.now(), level:i, res, pass});
  if(pass && S.level===i){ S.level=i+1; S.open=Math.min(S.level, LEVELS.length-1); }
  save(); SH.result={res, pass}; renderSheet(); renderMain();
}


function lastFor(exId, sessions){ const ss=[...(sessions||S.sessions)].sort((a,b)=>b.ts-a.ts); for(const s of ss){ const it=s.items?.find(i=>i.exId===exId); if(it && it.sets?.length) return it; } return null; }

function weekStreak(sessions){
  const wk=new Set(sessions.map(s=>dkey(mondayOf(new Date(s.ts||s.date)))));
  let m=mondayOf(new Date()), n=0; if(!wk.has(dkey(m))) m=addDays(m,-7);
  while(wk.has(dkey(m))){ n++; m=addDays(m,-7); } return n;
}

function bwCard(bw, editable){
  const pts=[...bw].sort((a,b)=>a.d<b.d?-1:1); const last=pts[pts.length-1];
  const ago=dkey(addDays(new Date(),-30)); const base=pts.filter(p=>p.d<=ago).pop() || pts[0];
  const delta = last && base && base!==last ? Math.round((last.kg-base.kg)*10)/10 : null;
  return `<section class="card bw"><div class="row sp"><div class="eyebrow">${t('bodyWeight')}</div>${delta!==null?`<span class="delta ${delta<=0?'dn':'up'}">${delta>0?'+':''}${delta} ${t('kg')} / 30d</span>`:''}</div>
    <div class="bignum">${last? last.kg : '—'}<small> ${t('kg')}</small></div>${bwChart(pts.slice(-40))}
    ${editable&&S.uid?`<form class="bwform" data-form="bw"><label class="sr" for="bw-in">${t('bodyWeight')}</label><input id="bw-in" type="number" step="0.1" min="20" max="300" inputmode="decimal" placeholder="${t('wph')}" required><button class="btn sm">${t('logWeight')}</button></form>`:''}</section>`;
}

function bwChart(pts){
  if(pts.length<2) return '<div class="chart-empty"></div>';
  const W=300,H=90,px=4,py=10, xs=pts.map(p=>new Date(p.d).getTime()), ys=pts.map(p=>p.kg);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys)-0.4, y1=Math.max(...ys)+0.4;
  const X=x=>px+(x-x0)/(x1-x0||1)*(W-2*px), Y=y=>py+(1-(y-y0)/(y1-y0||1))*(H-2*py);
  const line=pts.map((p,i)=>(i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.kg).toFixed(1)).join(' ');
  const lx=X(xs[xs.length-1]), ly=Y(ys[ys.length-1]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" x2="${W}" y1="${Y(y1-0.4).toFixed(1)}" y2="${Y(y1-0.4).toFixed(1)}" class="grid"/><line x1="0" x2="${W}" y1="${Y(y0+0.4).toFixed(1)}" y2="${Y(y0+0.4).toFixed(1)}" class="grid"/>
    <path d="${line} L${lx.toFixed(1)} ${H} L${X(x0).toFixed(1)} ${H} Z" class="area"/><path d="${line}" class="ln"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3.5" class="dot"/></svg>
    <div class="axis"><span>${fmtDate(pts[0].d)}</span><span>${Math.min(...ys)}–${Math.max(...ys)} ${t('kg')}</span><span>${fmtDate(pts[pts.length-1].d)}</span></div>`;
}

function vStats(data, mine){
  const ss=[...(data.sessions||[])].sort((a,b)=>b.ts-a.ts), now=new Date(), month=dkey(now).slice(0,7);
  const totalReps=ss.reduce((a,s)=>a+(s.totalReps||0),0), totalSets=ss.reduce((a,s)=>a+(s.totalSets||0),0);
  const tiles=[[t('workouts'),ss.length],[t('thisMonth'),ss.filter(s=>s.date?.slice(0,7)===month).length],[t('weekStreak'),weekStreak(ss)],[t('totalReps'),totalReps.toLocaleString()]];
  const pbs={}; for(const s of ss) for(const it of s.items||[]){ const m=Math.max(0,...(it.sets||[])); if(!pbs[it.exId] || m>pbs[it.exId].v) pbs[it.exId]={v:m, mode:it.mode, date:s.date}; }
  const pbList=Object.entries(pbs).filter(([id])=>S.ex[id]).sort((a,b)=>b[1].v-a[1].v).slice(0,8);
  return `<div class="tiles">${tiles.map(([k,v])=>`<div class="tile"><div class="bignum sm">${v}</div><div class="muted small">${k}</div></div>`).join('')}</div>
   <section class="card"><div class="row sp"><div class="eyebrow">${t('activity')}</div><div class="muted small">${t('setsDone')}: ${totalSets}</div></div>${heatmap(ss)}</section>
   ${bwCard(data.bw||[], mine)}
   <section class="card"><div class="eyebrow">${t('pbs')}</div>${pbList.length?`<ul class="pbs">${pbList.map(([id,p])=>`<li>${figHTML(S.ex[id].anim,'thumb')}<span>${esc(exName(S.ex[id]))}</span><b>${p.v}${p.mode==='time'?t('sec'):''}</b><span class="muted small">${fmtDate(p.date)}</span></li>`).join('')}</ul>`:`<p class="muted small">${t('noData')}</p>`}</section>
   <section class="card"><div class="eyebrow">${t('recent')}</div>${ss.length?`<ul class="recent">${ss.slice(0,8).map(s=>`<li><div><b>${esc(s.title||'')}</b><span class="muted small">${fmtDate(s.date)} · ${fmtDur(s.dur||0)}</span></div><div class="nums"><span>${s.totalSets||0} ${t('sets').toLowerCase()}</span><span>${s.totalReps||0} ${t('reps').toLowerCase()}</span></div></li>`).join('')}</ul>`:`<p class="muted small">${t('noData')}</p>`}</section>`;
}

function heatmap(ss){
  const per={}; for(const s of ss) per[s.date]=(per[s.date]||0)+(s.totalSets||1);
  const weeks=26, start=addDays(mondayOf(new Date()), -7*(weeks-1)), cs=11, g=3, left=22, top=14;
  let cells='', months='', lastM=-1; const today=dkey(new Date());
  for(let w=0; w<weeks; w++){ const wd=addDays(start,7*w);
    if(wd.getMonth()!==lastM){ lastM=wd.getMonth(); if(w<weeks-1) months+=`<text x="${left+w*(cs+g)}" y="9" class="hl">${t('mo')[lastM]}</text>`; }
    for(let d=0; d<7; d++){ const dt=addDays(wd,d), k=dkey(dt); if(k>today) continue; const v=per[k]||0;
      const lv= v===0?0 : v<8?1 : v<14?2 : v<20?3:4;
      cells+=`<rect x="${left+w*(cs+g)}" y="${top+d*(cs+g)}" width="${cs}" height="${cs}" rx="2.5" class="h${lv}"><title>${fmtDate(k)}: ${v}</title></rect>`; } }
  const lbl=[0,2,4].map(d=>`<text x="0" y="${top+d*(cs+g)+9}" class="hl">${t('ds')[d]}</text>`).join('');
  const W=left+weeks*(cs+g), H=top+7*(cs+g);
  return `<div class="hm-wrap"><svg class="hm" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('activity'))}">${months}${lbl}${cells}</svg></div>
   <div class="legend muted small"><span>0</span>${[0,1,2,3,4].map(l=>`<i class="h${l}"></i>`).join('')}<span>20+</span></div>`;
}

let W=null, woTimer=null, wakeLock=null, actx=null;
function beep(){ try{ actx ??= new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.18, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.35); o.start(); o.stop(actx.currentTime+.36); }catch(e){} try{ navigator.vibrate?.(200); }catch(e){} }
function startWorkout(lv, day){
  const items=planItems(lv,day).map(it=>({...it, ex:EX[it.exId]}));
  if(!items.length) return;
  W={level:lv, day:+day, title:t('lvn')[lv]+' · '+t(DAYK[day]), items, i:0, start:Date.now(), rest:null, hold:null, figI:-1, quit:false, done:false,
     val:items.map(it=>{ const last=lastFor(it.exId); const base=it.ex.mode==='time'?+it.secs:+it.reps; return Array.from({length:+it.sets},(_,s)=> last?.sets?.[s] && last.sets[s]>base ? last.sets[s] : base); }),
     ok:items.map(it=>Array(+it.sets).fill(false))};
  navPush(); $('#wo').hidden=false; document.body.classList.add('noscroll'); renderWO();
  clearInterval(woTimer); woTimer=setInterval(woTick, 250);
  try{ navigator.wakeLock?.request('screen').then(l=>wakeLock=l).catch(()=>{}); }catch(e){}
  try{ actx ??= new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function woCounts(){ let d=0,tt=0; W.ok.forEach(a=>{ tt+=a.length; d+=a.filter(Boolean).length; }); return [d,tt]; }
function renderWO(){
  const el=$('#wo');
  if(W.done) return renderSummary();
  const it=W.items[W.i], ex=it.ex, time=ex.mode==='time', [d,tt]=woCounts(), last=lastFor(it.exId);
  if(!el.querySelector('.wo-shell')) el.innerHTML=`<div class="wo-shell"><header class="wo-head" id="wo-head"></header><div class="wo-scroll"><div class="wo-fig" id="wo-fig"></div><div id="wo-body"></div></div><div id="wo-rest"></div><nav class="wo-nav" id="wo-nav"></nav></div>`;
  $('#wo-head').innerHTML=`<button class="ibtn" data-act="woquit" aria-label="${t('quit')}">✕</button>
    <div class="wo-title"><b>${esc(W.title)}</b><span class="muted small"><span id="wo-clock">${fmtClock((Date.now()-W.start)/1000)}</span> · ${t('setsProg',{d,t:tt})}</span></div>
    <button class="ibtn ok" data-act="wofinish" aria-label="${t('finish')}">✓</button><div class="wo-prog"><i style="width:${tt?d/tt*100:0}%"></i></div>`;
  if(W.figI!==W.i){ const mu=exMuscles(ex); $('#wo-fig').innerHTML=`<div class="figcard">${figHTML(ex.anim,'big anim')}<div class="mapbox">${bodyMap(mu,false)}<div class="legend2"><span><i class="pri"></i>${t('primary')}</span><span><i class="sec"></i>${t('secondary')}</span></div></div></div>${muscleChips(mu)}`; W.figI=W.i; }
  const rows=W.val[W.i].map((v,s)=>{ const ok=W.ok[W.i][s], holding=W.hold && W.hold.s===s;
    return `<li class="${ok?'ok':''}"><span class="sn">${s+1}</span>
      <div class="step"><button class="ibtn" data-act="wostep" data-s="${s}" data-d="-1" aria-label="-">−</button><b>${v}${time?t('sec'):''}</b><button class="ibtn" data-act="wostep" data-s="${s}" data-d="1" aria-label="+">+</button></div>
      ${time && !ok ? `<button class="btn sm ${holding?'':'ghost'}" data-act="wohold" data-s="${s}">${holding?`<span id="wo-hold">${fmtClock((W.hold.end-Date.now())/1000)}</span>`:'▶ '+t('holdStart')}</button>`:''}
      <button class="check${ok?' on':''}" data-act="wocheck" data-s="${s}" aria-label="${t('set')} ${s+1}">✓</button></li>`; }).join('');
  $('#wo-body').innerHTML=`<div class="eyebrow">${t('exOf',{i:W.i+1,n:W.items.length})}</div><h2>${esc(exName(ex))}</h2>
    <div class="chips"><span class="chip st">${t(ex.type||'push')}</span><span class="chip st">${t('target')}: ${tgt(it)}</span><span class="chip st">${t('rest')} ${it.rest}${t('sec')}</span>${last?`<span class="chip st acc">${t('lastTime')}: ${last.sets.join(' · ')}${time?t('sec'):''}</span>`:''}</div>
    ${exCue(ex)?`<p class="cue">${esc(exCue(ex))}</p>`:''}
    <ol class="setrows"><li class="hdr"><span>${t('set')}</span><span>${time?t('seconds'):t('reps')}</span><span></span></li>${rows}</ol>
    <div class="dots">${W.items.map((x,i)=>`<button class="dotb${i===W.i?' cur':''}${W.ok[i].every(Boolean)?' fin':''}" data-act="wogo" data-i="${i}" aria-label="${esc(exName(x.ex))}"></button>`).join('')}</div>`;
  renderRest();
  $('#wo-nav').innerHTML=`<button class="btn ghost" data-act="wogo" data-i="${W.i-1}"${W.i===0?' disabled':''}>← ${t('prev')}</button>
    ${W.i<W.items.length-1?`<button class="btn pri" data-act="wogo" data-i="${W.i+1}">${t('next')} →</button>`:`<button class="btn pri" data-act="wofinish">${t('finish')} ✓</button>`}`;
  if(W.quit){ $('#wo-rest').innerHTML=`<div class="quitbox"><p>${t('quitAsk')}</p><div class="row end"><button class="btn ghost" data-act="woresume">${t('resume')}</button><button class="btn danger" data-act="woquityes">${t('quitYes')}</button></div></div>`; }
}
function renderRest(){
  const box=$('#wo-rest'); if(!box || W.quit) return;
  if(!W.rest){ box.innerHTML=''; return; }
  const left=(W.rest.end-Date.now())/1000;
  box.innerHTML=`<div class="restbar"><div><div class="eyebrow">${t('restNow')}</div><div class="restclock" id="wo-restclock">${fmtClock(left)}</div></div>
    <div class="rtrack"><i id="wo-resttrack" style="width:${Math.max(0,left/W.rest.total*100)}%"></i></div>
    <button class="btn sm ghost" data-act="woplus">+15${t('sec')}</button><button class="btn sm pri" data-act="woskip">${t('skip')}</button></div>`;
}
function woTick(){
  if(!W || W.done) return;
  const c=$('#wo-clock'); if(c) c.textContent=fmtClock((Date.now()-W.start)/1000);
  if(W.rest){ const left=(W.rest.end-Date.now())/1000;
    if(left<=0){ W.rest=null; beep(); renderRest(); }
    else { const rc=$('#wo-restclock'), tr=$('#wo-resttrack'); if(rc) rc.textContent=fmtClock(left); if(tr) tr.style.width=Math.max(0,left/W.rest.total*100)+'%'; } }
  if(W.hold){ const left=(W.hold.end-Date.now())/1000;
    if(left<=0){ const {i,s}=W.hold; W.hold=null; beep(); markSet(i,s,true); }
    else { const h=$('#wo-hold'); if(h) h.textContent=fmtClock(left); } }
}
function markSet(i, s, on){
  W.ok[i][s]=on;
  if(on){ const it=W.items[i]; const allDone=W.ok.every(a=>a.every(Boolean));
    if(!allDone && +it.rest>0) W.rest={end:Date.now()+it.rest*1000, total:+it.rest};
    if(W.ok[i].every(Boolean) && i===W.i && i<W.items.length-1){ W.i=i+1; } }
  renderWO();
}
async function finishWorkout(){
  const items=W.items.map((it,i)=>({exId:it.exId, mode:it.ex.mode, sets:W.val[i].filter((v,s)=>W.ok[i][s])})).filter(x=>x.sets.length);
  W.done=true; W.rest=null; W.hold=null;
  if(!items.length){ closeWO(); return; }
  const doc={date:dkey(new Date(W.start)), ts:W.start, dur:Math.round((Date.now()-W.start)/1000), level:W.level, day:W.day, title:W.title, items,
    totalReps:items.reduce((a,i)=>a+(i.mode==='reps'?i.sets.reduce((x,y)=>x+y,0):0),0), totalSets:items.reduce((a,i)=>a+i.sets.length,0)};
  W.summary=doc; W.saved=null; renderWO();
  if(!S.uid){ W.saved=false; renderWO(); return; }
  W.saved = await put('logs/'+S.uid+'/w/'+uidGen('w'), doc); renderWO();
}
function renderSummary(){
  const s=W.summary; if(!s) return;
  $('#wo').innerHTML=`<div class="wo-shell"><div class="summary">${figHTML('jumping-jack','big anim')}<h2>${t('finishTitle')}</h2><p class="muted">${esc(s.title)}</p>
    <div class="tiles"><div class="tile"><div class="bignum sm">${fmtClock(s.dur)}</div><div class="muted small">${t('duration')}</div></div><div class="tile"><div class="bignum sm">${s.totalSets}</div><div class="muted small">${t('sets')}</div></div><div class="tile"><div class="bignum sm">${s.totalReps}</div><div class="muted small">${t('totalReps')}</div></div></div>
    <p class="small ${W.saved===false?'dangertxt':'muted'}">${W.saved===null?'…':W.saved?t('wsaved'):(S.uid?t('notSaved'):t('signedOut'))}</p>
    <button class="btn pri big" data-act="woclose">${t('close')}</button></div></div>`;
  mountFigs($('#wo'));
}
function closeWO(){ navBack(_closeWO); }
function _closeWO(){ clearInterval(woTimer); W=null; $('#wo').hidden=true; $('#wo').innerHTML=''; document.body.classList.remove('noscroll'); try{ wakeLock?.release(); }catch(e){} wakeLock=null; renderMain(); }


/* ===== Phone back button: step back inside the app ===== */
let navOK=true, navSkip=0;
function navPush(){ if(!navOK) return; try{ history.pushState({cx:1}, ''); }catch(e){ navOK=false; } }
function navBack(fallback){ if(navOK){ try{ history.back(); return; }catch(e){ navOK=false; } } fallback(); }
window.addEventListener('popstate', ()=>{
  if(navSkip>0){ navSkip--; return; }
  if(W){
    if(W.done){ _closeWO(); return; }
    if(!W.quit){ W.quit=true; renderWO(); navPush(); return; }
    _closeWO(); return;
  }
  if(SH){ _closeSheet(); return; }
  if(S.view!=='levels'){ S.view='levels'; renderMain(); window.scrollTo(0,0); return; }
});

/* ===== Events ===== */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT' || (b.tagName==='INPUT' && b.type!=='checkbox')) return;
  const a=b.dataset.act, v=b.dataset.v;
  if(a==='lang'){ S.lang=v; store('cx-lang',v); renderAll(); if(SH) renderSheet(); if(W) { if(W.done) renderSummary(); else { W.figI=-1; renderWO(); } } }
  else if(a==='view'){
    if(v===S.view) return;
    if(v==='levels'){ navBack(()=>{ S.view='levels'; renderMain(); }); }
    else { if(S.view==='levels') navPush(); S.view=v; renderMain(); }
    window.scrollTo(0,0); }
  else if(a==='lvopen'){ S.open=+b.dataset.i; renderMain(); }
  else if(a==='start') startWorkout(+b.dataset.lv, +b.dataset.day);
  else if(a==='test') openSheet({kind:'test', lv:+b.dataset.lv});
  else if(a==='exinfo') openSheet({kind:'ex', id:b.dataset.id});
  else if(a==='export') exportData();
  else if(a==='sclose') closeSheet();
  else if(a==='wostep'){ const s=+b.dataset.s, time=W.items[W.i].ex.mode==='time'; W.val[W.i][s]=Math.max(1, W.val[W.i][s]+(+b.dataset.d)*(time?5:1)); renderWO(); }
  else if(a==='wocheck'){ const s=+b.dataset.s; if(W.hold?.s===s) W.hold=null; markSet(W.i, s, !W.ok[W.i][s]); }
  else if(a==='wohold'){ const s=+b.dataset.s; if(W.hold?.s===s){ W.hold=null; } else { W.rest=null; W.hold={i:W.i, s, end:Date.now()+W.val[W.i][s]*1000}; } renderWO(); }
  else if(a==='wogo'){ const i=+b.dataset.i; if(i>=0 && i<W.items.length){ W.i=i; W.hold=null; renderWO(); $('#wo .wo-scroll')?.scrollTo(0,0); } }
  else if(a==='woplus'){ if(W.rest){ W.rest.end+=15000; W.rest.total+=15; renderRest(); } }
  else if(a==='woskip'){ W.rest=null; renderRest(); }
  else if(a==='woquit'){ W.quit=true; renderWO(); }
  else if(a==='woresume'){ W.quit=false; renderWO(); }
  else if(a==='woquityes') closeWO();
  else if(a==='wofinish') finishWorkout();
  else if(a==='woclose') closeWO();
});
document.addEventListener('change', e=>{ const el=e.target; if(el.id==='imp' && el.files?.[0]){ importData(el.files[0]); el.value=''; } });
document.addEventListener('submit', async e=>{
  const f=e.target; e.preventDefault();
  if(f.dataset.form==='test'){ submitTest(f); return; }
  if(f.dataset.form!=='bw') return;
  const kg=Math.round(parseFloat(f.querySelector('input').value)*10)/10; if(!(kg>0)) return;
  const k=dkey(new Date()); const bw=S.bw.filter(p=>p.d!==k).concat([{d:k, kg}]).sort((a,b)=>a.d<b.d?-1:1).slice(-400);
  if(await put('logs/'+S.uid, {bw})) toast(t('saved'));
});
$('#sheet').addEventListener('click', e=>{ if(e.target.id==='sheet') closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && SH) closeSheet(); });
load(); renderAll();
</script>
